<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ if .IsHome }}
  <meta http-equiv="refresh" content="0; url=/about/">
  <link rel="canonical" href="{{ "/about/" | absURL }}">
  {{ end }}
  <link rel="stylesheet" href="/css/style.css">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
  {{ if or .Params.math .Site.Params.math }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ]
    });"></script>
  {{ end }}
</head>
<body>
  <header>
    <a href="/" class="site-title">Winterstar</a>
    <nav>
      <a href="/about/">About</a>
      <a href="/posts/">Posts</a>
      <a href="/categories/">Categories</a>
      <a href="/tags/">Tags</a>
    </nav>
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
  </header>
  <main>
    {{- block "main" . }}{{- end }}
  </main>
  <footer>
  </footer>
  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀' : '☾';
    }
    (function() {
      var stored = localStorage.getItem('theme');
      var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('theme-toggle').textContent = isDark ? '☀' : '☾';
    }());
  </script>
</body>
</html>
